version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=django-insecure-prod-key-change-this-in-env-file
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_PATH=/app/data/db.sqlite3
    volumes:
      - sqlite-data:/app/data
    depends_on:
      - redis

  redis:
    image: redis:alpine
    expose:
      - "6379"

volumes:
  sqlite-data:
